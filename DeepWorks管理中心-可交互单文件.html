function selectAllOrganizationUsers(id){let c=currentModal().ctx;if(c.submitting)return;let list=selectableOrganizationUsers(c,id),all=list.length>0&&list.every(u=>c.chosen.has(u.id));list.forEach(u=>all?c.chosen.delete(u.id):c.chosen.add(u.id));syncMemberSelection()}
function memberCandidates(){let c=currentModal()?.ctx;return c?.type==='addMembers'?users.filter(u=>[u.name,u.account,u.phone,u.email].some(s=>String(s||'').toLowerCase().includes(c.query.toLowerCase()))):[]}
function refreshAddMembers(){let c=currentModal().ctx;updateModal(`<div class="info"><strong>为「${esc(role(c.roleId).name)}」角色添加成员</strong><div class="sub">请选择要关联该角色的成员或组织</div><div id="member-number" class="member-stat" aria-live="polite">${memberSelectionText(c)}</div></div><div class="filters">${input('member-search','搜索组织名称、用户名、账号、手机号、邮箱',c.draft,'text',`class="member-search" oninput="currentModal().ctx.draft=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();searchMembers()}"`)}${btn('搜 索','searchMembers()',true)}${btn('重 置','resetMembersSearch()')}</div><div class="member-tree" id="member-tree" role="tree" aria-label="组织和用户"></div><div class="formerror"></div>`,btn('取消','closeModal()')+`<button id="add-member-submit" class="btn primary" onclick="saveMembers()" ${c.chosen.size+c.chosenOrgs.size?'':'disabled'}>添加成员</button>`);renderMemberTree()}
function searchMembers(){let c=currentModal().ctx,q=val('member-search').trim();if(c.query!==q)c.searchExpanded=new Set();c.query=q;c.draft=val('member-search');renderMemberTree()}
function resetMembersSearch(){let c=currentModal().ctx;c.query='';c.draft='';modalEl().querySelector('#member-search').value='';renderMemberTree()}
function memberExpanded(c){return c.query?(c.searchExpanded||(c.searchExpanded=new Set())):c.expanded}
function toggleMemberOrganization(id){let expanded=memberExpanded(currentModal().ctx);expanded.has(id)?expanded.delete(id):expanded.add(id);renderMemberTree()}
function memberTreeCheckbox(type,id,name){let c=currentModal().ctx,linked=isMemberTreeLinked(c.roleId,type,id),checked=type==='user'?selectedMemberIds(c).has(id):memberOrganizationState(c,id).checked;return `<input type="checkbox" data-member-type="${type}" data-member-id="${id}" aria-label="选择${type==='user'?'用户':'组织'}${esc(name)}" ${linked?'disabled title="已关联"':''} ${linked||checked?'checked':''} onchange="selectMemberObject('${type}',${id},this.checked)">`}
function memberUserNode(u,depth){let c=currentModal().ctx,linked=isDirectlyLinked(c.roleId,'user',u.id);return `<div class="member-node ${linked?'is-linked':c.chosen.has(u.id)?'is-selected':''}" role="treeitem" aria-level="${depth+1}" style="padding-left:${16+depth*24}px"><span class="twist"></span><label class="node-label">${memberTreeCheckbox('user',u.id,u.name)}${icon('users')}<span class="node-main">${esc(u.name)}<span class="secondary"> · ${esc(u.account)}</span>${linked?' <span class="tag">已关联</span>':''}</span></label></div>`}
function memberOrganizationNode(o,depth,searchResult=false){let c=currentModal().ctx,linked=isMemberTreeLinked(c.roleId,'organization',o.id),expanded=memberExpanded(c).has(o.id);return `<div class="member-node ${linked?'is-linked':c.chosenOrgs.has(o.id)?'is-selected':''}" role="treeitem" aria-level="${depth+1}" aria-expanded="${expanded}" style="padding-left:${16+depth*24}px"><button class="twist" aria-label="${expanded?'收起':'展开'}组织${esc(o.name)}" onclick="toggleMemberOrganization(${o.id})">${expanded?'▾':'▸'}</button><label class="node-label">${memberTreeCheckbox('organization',o.id,o.name)}${icon('folder')}<span class="node-main">${esc(o.name)}${linked?' <span class="tag">已关联</span>':''}${searchResult?`<div class="secondary">${esc(organizationPath(o.id))}</div>`:''}</span></label>${expanded?`<button class="link" data-select-organization-users="${o.id}" title="选择该组织及下级组织的人员，不勾选组织" onclick="selectAllOrganizationUsers(${o.id})">全选成员</button>`:''}</div>`}
function renderMemberTree(){let c=currentModal().ctx,html='';function branch(o,depth,searchRoot=false,seen=new Set()){if(seen.has(o.id))return;let next=new Set(seen).add(o.id);html+=memberOrganizationNode(o,depth,searchRoot);if(memberExpanded(c).has(o.id)){orgs.filter(child=>child.parent===o.id).forEach(child=>branch(child,depth+1,false,next));users.filter(u=>u.orgs.includes(o.id)).forEach(u=>html+=memberUserNode(u,depth+1))}}
  if(c.query){let q=c.query.toLowerCase(),matches=orgs.filter(o=>o.name.toLowerCase().includes(q));matches.forEach(o=>branch(o,0,true));memberCandidates().forEach(u=>html+=memberUserNode(u,0));}else{orgs.filter(o=>o.parent===null).forEach(o=>branch(o,0));users.filter(u=>!u.orgs.some(id=>orgs.some(o=>o.id===id))).forEach(u=>html+=memberUserNode(u,0))}
  let tree=modalEl().querySelector('#member-tree'),scroll=tree.scrollTop;tree.innerHTML=html||`<div class="empty">${icon('empty')}${c.query?'未找到匹配的组织或用户':'暂无组织或用户'}</div>`;tree.scrollTop=scroll;syncMemberSelection();currentModal().body=modalEl().querySelector('.modalbody').innerHTML}
function syncMemberSelection(){let c=currentModal().ctx;modalEl().querySelectorAll('[data-member-type]').forEach(input=>{let type=input.dataset.memberType,id=+input.dataset.memberId,linked=isMemberTreeLinked(c.roleId,type,id);input.checked=linked||(type==='organization'?c.chosenOrgs:c.chosen).has(id);input.indeterminate=false;input.disabled=linked||c.submitting;input.closest('.member-node').classList.toggle('is-linked',linked);input.closest('.member-node').classList.toggle('is-selected',!linked&&input.checked)});modalEl().querySelectorAll('[data-select-organization-users]').forEach(b=>{let id=+b.dataset.selectOrganizationUsers,list=selectableOrganizationUsers(c,id),all=list.length>0&&list.every(u=>c.chosen.has(u.id));b.textContent=all?'取消全选':'全选成员';b.disabled=c.submitting||!list.length;b.setAttribute('aria-label',(all?'取消全选':'全选成员')+orgs.find(o=>o.id===id).name+'下的人员')});modalEl().querySelector('#member-number').textContent=memberSelectionText(c);let b=modalEl().querySelector('#add-member-submit');b.disabled=c.submitting||!(c.chosen.size+c.chosenOrgs.size)}
function selectMemberObject(type,id,on){let c=currentModal().ctx;if(c.submitting||isMemberTreeLinked(c.roleId,type,id))return;let chosen=type==='organization'?c.chosenOrgs:c.chosen;on?chosen.add(id):chosen.delete(id);syncMemberSelection()}
function selectMember(id,on){selectMemberObject('user',id,on)}
function memberSubmitState(modal,label){modal.ctx.submitting=true;modalEl().querySelectorAll('button,input').forEach(el=>el.disabled=true);let b=modalEl().querySelector('.modalfoot .primary');b.innerHTML='<span class="loading-ring"></span>'+label;b.setAttribute('aria-busy','true')}
async function saveMembers(){let modal=currentModal(),c=modal.ctx;if(c.submitting||!(c.chosen.size+c.chosenOrgs.size))return;memberSubmitState(modal,'添加中…');await new Promise(resolve=>setTimeout(resolve,180));if(currentModal()!==modal||!role(c.roleId))return;let added=0;c.chosen.forEach(id=>{if(addDirectMember(c.roleId,id,{source:'MANUAL'}))added++});c.chosenOrgs.forEach(id=>{if(orgs.some(o=>o.id===id)&&!organizationLinks(c.roleId).has(id)){organizationLinks(c.roleId).set(id,{createdAt:now()});added++}});c.submitting=false;closeModal();refreshMembers();render();toast(`添加成功，新增 ${added} 个关联对象`)}

function userMenu(e,id){showMenu(e,menuItem('设置默认产品',`openProduct(${id})`)+menuItem('变更组织',`openChangeOrg(${id})`)+menuItem('删除',`deleteUsers(${id})`,true))}
function deleteUsers(id){let ids=id?[id]:[...selected];confirmDialog(id?'确认删除当前用户吗？':'确认删除选中用户吗？',()=>{users=users.filter(u=>!ids.includes(u.id));ids.forEach(i=>selected.delete(i));closeModal();render();toast('删除成功')},true)}
function orgMenu(e,id){showMenu(e,menuItem('添加下级组织',`openOrg(${id},false)`)+menuItem('重命名',`openOrg(${id},true)`)+menuItem('删除',`deleteOrg(${id})`,true))}
function openOrg(id,rename){let o=orgs.find(o=>o.id===id);openModal(rename?'重命名':'添加组织',field(rename?'当前组织':'上级组织',input('parent','',o.name,'text','disabled'))+field('组织名称',input('org-name','请输入组织名称',rename?o.name:''),true)+'<div class="formerror"></div>',btn('取 消','closeModal()')+btn('确 定','saveOrg()',true),'',{orgId:id,rename})}
function saveOrg(){let c=currentModal().ctx,name=val('org-name').trim();if(!name)return error('请输入组织名称');if(c.rename)orgs.find(o=>o.id===c.orgId).name=name;else{orgs.push({id:++nextId,name,parent:c.orgId});orgCollapsed.delete(c.orgId)}closeModal();render();toast('保存成功')}
function deleteOrg(id){let o=orgs.find(o=>o.id===id);confirmDialog(`确认删除组织「${o.name}」吗？`,()=>{if(users.some(u=>u.orgs.includes(id))||orgs.some(o=>o.parent===id))return error('组织下存在用户或子组织，无法删除');orgs=orgs.filter(o=>o.id!==id);if(activeOrg===id)activeOrg=orgs[0]?.id||null;closeModal();render();toast('删除成功')},true,'删除前会校验组织下是否存在用户或子组织。')}
function orgOptions(ids){let out=[];function visit(parent,level){orgs.filter(o=>o.parent===parent).forEach(o=>{out.push(`<label style="padding-left:${8+level*16}px"><input type="checkbox" value="${o.id}" ${ids.includes(o.id)?'checked':''} onchange="changeFormOrgs()">${icon('folder')}${esc(o.name)}</label>`);visit(o.id,level+1)})}visit(null,0);return out.join('')||'<span class="hint">暂无数据</span>'}
function orgFields(ids,primary){return field('所属组织',`<div class="orgselect" tabindex="0" role="button" aria-label="选择所属组织" onclick="toggleOrgOptions()" onkeydown="if(event.key==='Enter'){toggleOrgOptions()}"><span id="org-tags">${ids.map(id=>`<span class="tag blue">${esc(orgNames([id]))}</span>`).join('')||'请选择所属组织'}</span><span style="float:right;color:#9aa3b0">⌄</span></div><div class="orgoptions" id="form-org-options" hidden>${orgOptions(ids)}</div>`,true)+field('主组织',`<select id="primary-org" aria-label="主组织">${ids.map(id=>`<option value="${id}" ${primary===id?'selected':''}>${esc(orgNames([id]))}</option>`).join('')}</select>`,true)}
function toggleOrgOptions(){let el=modalEl().querySelector('#form-org-options');el.hidden=!el.hidden}
function formOrgs(){return [...modalEl().querySelectorAll('#form-org-options input:checked')].map(x=>+x.value)}
function changeFormOrgs(){let ids=formOrgs(),s=modalEl().querySelector('#primary-org'),current=+s.value;s.innerHTML=ids.map(id=>`<option value="${id}" ${id===current?'selected':''}>${esc(orgNames([id]))}</option>`).join('');modalEl().querySelector('#org-tags').innerHTML=ids.map(id=>`<span class="tag blue">${esc(orgNames([id]))}</span>`).join('')||'请选择所属组织'}
function openUser(id){let u=user(id),ids=u?.orgs||[activeOrg||orgs[0]?.id].filter(Boolean);openModal(u?'编辑用户':'新增用户',`<div class="formgrid">${field('用户名',input('name','请输入用户名',u?.name),true)}${u?'':field('登录账号',input('account','请输入登录账号'),true)}${field('密码',`<div class="password">${input('password',u?'不填则不修改密码':'不填默认 Deepexi@2026','','password')}<button type="button" class="iconbtn" aria-label="显示或隐藏密码" onclick="let p=modalEl().querySelector('#password');p.type=p.type==='password'?'text':'password'">${icon('eye')}</button></div>`)}${field('是否为虚拟账号',`<select id="virtual" aria-label="是否为虚拟账号"><option ${u?.virtual!=='是'?'selected':''}>否</option><option ${u?.virtual==='是'?'selected':''}>是</option></select>`,true)}${field('手机号',input('phone','手机号或邮箱至少填写一项',u?.phone))}${field('邮箱',input('email','手机号或邮箱至少填写一项',u?.email==='--'?'':u?.email))}${orgFields(ids,u?.primaryOrg||ids[0])}${field('状态',`<select id="enabled" aria-label="状态" ${id===1?'disabled title="租户管理员状态不可修改"':''}><option value="true" ${u?.enabled!==false?'selected':''}>启用</option><option value="false" ${u?.enabled===false?'selected':''}>禁用</option></select>`,true)}</div><div class="formerror"></div>`,btn('取 消','closeModal()')+btn('确 定','saveUser()',true),'medium',{userId:id})}
function saveUser(){let id=currentModal().ctx.userId,name=val('name').trim(),account=id?user(id).account:val('account').trim(),phone=val('phone').trim(),email=val('email').trim(),ids=formOrgs(),primaryOrg=+val('primary-org');if(!name)return error('请输入用户名');if(!account)return error('请输入登录账号');if(!phone&&!email)return error('手机号或邮箱至少填写一项');if(!ids.length)return error('请选择所属组织');if(!ids.includes(primaryOrg))return error('请选择主组织');if(users.some(u=>u.id!==id&&u.account===account))return error('登录账号已存在');let data={name,account,phone,email:email||'--',orgs:ids,primaryOrg,virtual:val('virtual'),enabled:id===1?true:val('enabled')==='true'};if(id)Object.assign(user(id),data);else users.push({...data,id:++nextId,date:now(),roles:[],extra:[],defaultProduct:''});closeModal();render();toast(id?'编辑成功':'新增成功')}
function openChangeOrg(id){let u=user(id);openModal('变更组织',field('用户',input('user','',u.name,'text','disabled'))+orgFields(u.orgs,u.primaryOrg)+'<div class="formerror"></div>',btn('取 消','closeModal()')+btn('确 定','saveChangeOrg()',true),'',{userId:id})}
function saveChangeOrg(){let ids=formOrgs(),p=+val('primary-org');if(!ids.length||!ids.includes(p))return error('请选择所属组织和主组织');Object.assign(user(currentModal().ctx.userId),{orgs:ids,primaryOrg:p});closeModal();render();toast('变更组织成功')}
function openAuth(id,batch=false){openModal(batch?'批量授权':'用户授权','','','wide',{type:'auth',userId:id,batch,ids:batch?[...selected]:[id],chosen:new Set(batch?[]:user(id).roles),query:''});refreshAuth()}
function authCustomVisible(){let c=currentModal()?.ctx;return c?.type==='auth'?roles.filter(r=>!r.default&&r.name.toLowerCase().includes(c.query.toLowerCase())):[]}
function refreshAuth(){let c=currentModal().ctx;let list=roles.filter(r=>r.name.toLowerCase().includes(c.query.toLowerCase()));updateModal(`<div class="info"><strong>${c.batch?'已选择 '+c.ids.length+' 位用户':'正在为 '+esc(user(c.userId).name)+' 授权'}</strong><div class="sub">${c.batch?'请选择要绑定的角色，系统会为选中用户追加缺失角色并自动跳过重复绑定。':'请选择要绑定的角色，保存后系统会以当前勾选结果更新该用户角色。'}</div></div><div class="info">默认角色由产品自动授予，暂不支持取消授权。</div><div class="filters">${input('auth-query','搜索角色名称',c.query)}${btn('搜 索',"currentModal().ctx.query=val('auth-query');refreshAuth()",true)}${btn('重 置',"currentModal().ctx.query='';refreshAuth()")}</div><div class="tablewrap" style="max-height:300px"><table style="min-width:850px"><thead><tr><th><input type="checkbox" aria-label="全选可授权角色" data-select-all="auth" onchange="selectMany('auth',this.checked)"></th>${['角色名称','角色编码','角色描述','状态','操作'].map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${list.map(r=>`<tr><td><input aria-label="选择角色${esc(r.name)}" type="checkbox" ${r.default?'checked disabled title="默认角色由产品自动授予，暂不支持取消授权。"':`${c.chosen.has(r.id)?'checked':''} onchange="selectAuth(${r.id},this.checked)"`}></td><td>${esc(r.name)}${r.default?' <span class="tag blue">默认</span>':''}</td><td>${r.code}</td><td style="max-width:270px;overflow:hidden;text-overflow:ellipsis" title="${esc(r.desc||'--')}">${esc(r.desc||'--')}</td><td>${r.enabled?'启用':'禁用'}</td><td>${link('详情',`openPermission(${r.id},true)`)}</td></tr>`).join('')||empty(6)}</tbody></table></div><div class="selectedtags">已选角色：${roles.filter(r=>r.default||c.chosen.has(r.id)).map(r=>`<span class="tag ${r.default?'':'blue'}">${esc(r.name)}${r.default?'':`<button aria-label="移除角色${esc(r.name)}" onclick="selectAuth(${r.id},false)">×</button>`}</span>`).join('')}</div>`,btn('取 消','closeModal()')+btn('确定授权','saveAuth()',true,c.batch&&!c.chosen.size))}
function selectAuth(id,on){let c=currentModal().ctx;on?c.chosen.add(id):c.chosen.delete(id);refreshAuth()}
function saveAuth(){let c=currentModal().ctx;c.ids.forEach(id=>{let u=user(id);u.roles=c.batch?[...new Set([...u.roles,...c.chosen])]:[...c.chosen]});closeModal();render();toast('授权成功')}
function openProduct(id,batch=false){openModal(batch?'批量设置默认产品':'设置默认产品',`<div class="info">设置默认产品后用户登录完成优先跳转至该产品，请确保用户拥有该产品访问权限。</div><div style="margin-bottom:20px">${batch?'已选择 '+selected.size+' 个用户':'当前用户：'+esc(user(id).name)}</div>${field('请选择默认产品',`<div class="combo">${input('default-product','请选择默认产品','','text',`onclick="event.stopPropagation();productChoices(this)" oninput="productChoices(this)" autocomplete="off"`)}</div>`)}<div class="formerror"></div>`,btn('取 消','closeModal()')+btn('保 存','saveProduct()',true),'',{ids:batch?[...selected]:[id]})}
function productChoices(el){document.querySelectorAll('.choices').forEach(x=>x.remove());let box=document.createElement('div');box.className='choices';box.innerHTML='<div class="empty" style="padding:16px!important">暂无数据</div>';el.parentElement.appendChild(box)}
function saveProduct(){if(val('default-product').trim())return error('暂无数据');currentModal().ctx.ids.forEach(id=>{if(user(id))user(id).defaultProduct=''});closeModal();toast('保存成功')}
function openAttributes(){openModal('用户属性','','','medium',{type:'attributes',query:''});refreshAttributes()}
function refreshAttributes(){let c=currentModal().ctx;updateModal(`<div class="filters">${search('属性名称',c.query,"currentModal().ctx.query=this.value;attributeRows()",'attribute-query')}<span style="margin-left:auto">${btn('新建属性','openAttribute()',true)}</span></div><div id="attribute-list"></div>`,btn('关 闭','closeModal()'));attributeRows()}
function attributeRows(){let c=currentModal().ctx;let html=`<div class="tablewrap"><table><thead><tr>${['属性名称','输入方式','属性描述','操作'].map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${attributes.filter(a=>a.name.includes(c.query)).sort((a,b)=>a.order-b.order).map(a=>`<tr><td>${esc(a.name)}</td><td>${a.mode}</td><td>${esc(a.desc||'--')}</td><td><div class="rowactions">${link('编辑',`openAttribute(${a.id})`)}${link('删除',`deleteAttribute(${a.id})`)}</div></td></tr>`).join('')||empty(4,'暂无用户属性')}</tbody></table></div>`;$('#attribute-list').innerHTML=html;currentModal().body=modalEl().querySelector('.modalbody').innerHTML}
function openAttribute(id){let a=attributes.find(a=>a.id===id);openModal(a?'编辑属性':'新增属性',`<div class="sectiontitle">基本信息</div>${field('属性名称',input('attr-name','请输入',a?.name),true)}${field('属性标识',input('attr-code','请输入',a?.code),true)}${field('属性描述',`<textarea id="attr-desc" maxlength="255" placeholder="请输入" oninput="this.nextElementSibling.textContent=this.value.length+' / 255'">${esc(a?.desc||'')}</textarea><div class="counter">${a?.desc.length||0} / 255</div>`)}${field('属性排序',input('attr-order','',a?.order||0,'number','min="0" step="1"'))}${field('输入方式',`<label class="radio"><input type="radio" name="attr-mode" value="手动输入" ${a?.mode!=='下拉框'?'checked':''} onchange="toggleAttributeOptions(false)">手动输入</label><label class="radio"><input type="radio" name="attr-mode" value="下拉框" ${a?.mode==='下拉框'?'checked':''} onchange="toggleAttributeOptions(true)">下拉框</label>`)}<div id="attr-options" ${a?.mode==='下拉框'?'':'hidden'} class="attribute-placeholder">选项配置<!-- 待产品方补充真实下拉选项配置规则 --></div><div class="sectiontitle" style="margin-top:20px">输入限制</div>${field('是否必填',`<label class="radio"><input type="radio" name="attr-required" value="是" ${a?.required==='是'?'checked':''}>是</label><label class="radio"><input type="radio" name="attr-required" value="否" ${a?.required!=='是'?'checked':''}>否</label>`)}${field('字数限制',input('attr-limit','',a?.limit||255,'number','min="1" step="1"'),true)}<div class="formerror"></div>`,btn('取 消','closeModal()')+btn('确 定','saveAttribute()',true),'',{attributeId:id})}
function toggleAttributeOptions(on){$('#attr-options').hidden=!on}
function saveAttribute(){let id=currentModal().ctx.attributeId,name=val('attr-name').trim(),code=val('attr-code').trim(),order=+val('attr-order'),limit=+val('attr-limit');if(!name||!code)return error('请输入属性名称和属性标识');if(!Number.isInteger(order)||order<0||!Number.isInteger(limit)||limit<1)return error('请输入有效的属性排序和字数限制');if(attributes.some(a=>a.code===code&&a.id!==id))return error('属性标识已存在');let data={name,code,order,limit,desc:val('attr-desc'),mode:modalEl().querySelector('[name=attr-mode]:checked').value,required:modalEl().querySelector('[name=attr-required]:checked').value};if(id)Object.assign(attributes.find(a=>a.id===id),data);else attributes.push({...data,id:++nextId});closeModal();refreshAttributes();toast('保存成功')}
function deleteAttribute(id){confirmDialog('确认删除当前属性吗？',()=>{attributes=attributes.filter(a=>a.id!==id);closeModal();refreshAttributes();toast('删除成功')},true)}
async function toggleFullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}}
document.addEventListener('click',e=>{if(!e.target.closest('.menu,.combo'))closeMenu();let opts=modalEl()?.querySelector('#form-org-options');if(opts&&!e.target.closest('.orgselect,.orgoptions'))opts.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(menuOpen||document.querySelector('.choices'))closeMenu();else if(modalEl()?.querySelector('#form-org-options:not([hidden])'))modalEl().querySelector('#form-org-options').hidden=true;else if(stack.length)closeModal()}if(e.key==='Tab'&&stack.length){let f=[...modalEl().querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea,[tabindex="0"]')].filter(x=>x.getClientRects().length),first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
window.addEventListener('hashchange',()=>{stack=[];selected.clear();closeMenu();paintModals();render()});if(!location.hash){try{history.replaceState(null,'','#/management/iam/roles')}catch{location.hash='#/management/iam/roles'}}render();
</script></body></html>
